<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save Contact</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--wine:#4A1F2B;--deep:#35141E;--cream:#F4ECE4;--dim:#D9CBBF;--gold:#D8B98A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--deep);color:var(--cream);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;font-size:16px;line-height:1.5}
.page{max-width:460px;margin:0 auto;padding:32px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px))}
.card{background:var(--wine);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.label{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;line-height:1.05;color:#FDFDFD}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:15px}
dt{color:var(--gold)} dd{margin:0;overflow-wrap:anywhere}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:var(--cream);color:var(--wine);font-weight:600;text-decoration:none}
.note{margin:0;font-size:13px;color:var(--dim)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="page">
  <section class="card" id="ok" hidden>
    <p class="label">New connection</p>
    <h1 id="name"></h1>
    <dl id="details"></dl>
    <a class="btn" id="save" href="#">Save to my contacts</a>
    <p class="note">On iPhone, tap Save, then Create New Contact. On Android, choose your Contacts app.</p>
  </section>
  <section class="card" id="bad" hidden>
    <h1>Link not complete</h1>
    <p class="note">Open the full link from the inquiry email.</p>
  </section>
</main>
<script>
(function(){
  var esc=function(v){ return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); };
  var info;
  try{
    var h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/'); while(h.length%4) h+='=';
    var bin=atob(h), bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    info=JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ document.getElementById('bad').hidden=false; return; }
  if(!info||!info.n){ document.getElementById('bad').hidden=false; return; }
  var parts=info.n.trim().split(/\s+/), last=parts.length>1?parts.pop():'', first=parts.join(' ');
  var note='Met through my business card'+(info.d?' on '+info.d:'')+'.'+(info.m?' '+info.m:'');
  var v=['BEGIN:VCARD','VERSION:3.0','N:'+esc(last)+';'+esc(first)+';;;','FN:'+esc(info.n)];
  if(info.o) v.push('ORG:'+esc(info.o));
  if(info.p) v.push('TEL;TYPE=CELL:'+esc(info.p));
  if(info.e) v.push('EMAIL;TYPE=INTERNET:'+esc(info.e));
  v.push('NOTE:'+esc(note),'END:VCARD');
  var blob=new Blob([v.join('\r\n')+'\r\n'],{type:'text/vcard'});
  var a=document.getElementById('save'); a.href=URL.createObjectURL(blob); a.download=(info.n.replace(/[^\w ]+/g,'').trim().replace(/\s+/g,'-')||'contact')+'.vcf';
  document.getElementById('name').textContent=info.n;
  var dl=document.getElementById('details');
  [['Email',info.e],['Phone',info.p],['Organization',info.o],['Note',info.m]].forEach(function(r){ if(!r[1]) return; var dt=document.createElement('dt'); dt.textContent=r[0]; var dd=document.createElement('dd'); dd.textContent=r[1]; dl.appendChild(dt); dl.appendChild(dd); });
  document.getElementById('ok').hidden=false;
})();
</script>
</body>
</html>
